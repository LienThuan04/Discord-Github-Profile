<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="256" height="32" viewBox="0 0 256 32" role="img" aria-label="LiênThuận&#x27;s Discord presence"><foreignObject x="0" y="0" width="256" height="32"><div xmlns="http://www.w3.org/1999/xhtml"><div class="dgp-badge dark sx-root" style="width:256px;height:32px;--accent:#5865f2;--bg:#0a0d3a;--radius:16px"><style>
.dgp-badge{border-color:var(--accent)!important}
.dgp-badge{position:relative;display:inline-flex;align-items:center;gap:8px;box-sizing:border-box;overflow:hidden;padding:0 11px;border:1px solid #747cf14a;border-radius:min(var(--radius),16px);background:linear-gradient(110deg,#5865f226,#ec48bd15),var(--bg);color:#eeedff;font:12px/1 "Courier New",monospace;white-space:nowrap;vertical-align:middle}.dgp-badge.light{color:#252454;border-color:#5865f250}.dgp-badge .badge-avatar{flex:none;border-radius:50%;object-fit:cover;width:20px;height:20px;margin-left:-5px;margin-right:-3px}.dgp-badge .badge-dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 0 3px #5865f21a}.dgp-badge .online{background:#23a55a}.dgp-badge .idle{background:#f0b232}.dgp-badge .dnd{background:#f23f43}.dgp-badge .offline{background:#80848e}.dgp-badge .badge-text{overflow:hidden;text-overflow:ellipsis;min-width:0}
.dgp-badge .badges{display:flex;gap:4px;max-width:60px;overflow:hidden;flex:none}.dgp-badge .badges img{width:16px;height:16px;object-fit:contain}
.dgp-badge .badge-text{background:#111338;border-radius:2px;box-shadow:0 0 0 2px #111338}.dgp-badge.light .badge-text{background:#f6f5ff;box-shadow:0 0 0 2px #f6f5ff}

.pf-banner{position:absolute;inset:0;overflow:hidden;pointer-events:none;background-size:cover}.pf-banner>img,.pf-banner>video{display:block;width:100%;height:100%;object-fit:cover}
.pf-effect{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:4;border-radius:inherit;}.pf-effect img{position:absolute;display:block;max-width:none;object-fit:fill}.pf-effect .pf-fx-still{left:0;top:0;width:100%;height:auto;min-width:100%}.pf-effect .pf-player{position:absolute;inset:0}.pf-effect .pf-playing>.pf-fx-still{display:none}
.pf-effect.pf-underlay{z-index:-1}
.sx-root{isolation:isolate}
.sx-root .sx-ring{position:absolute;z-index:-1;--sx-ro:calc(var(--sx-ring-gap,3px) + var(--sx-ring-w,3px) / 2);left:calc(-1 * var(--sx-ro));top:calc(-1 * var(--sx-ro));width:calc(100% + 2 * var(--sx-ro));height:calc(100% + 2 * var(--sx-ro));overflow:visible;pointer-events:none;display:block}.sx-root .sx-ring path{fill:none;stroke:var(--accent);stroke-width:var(--sx-ring-w,3px);stroke-linejoin:round;stroke-linecap:round}.sx-root .sx-ring.sx-is-online path{stroke:#23a55a}.sx-root .sx-ring.sx-is-idle path{stroke:#f0b232}.sx-root .sx-ring.sx-is-dnd path{stroke:#f23f43}.sx-root .sx-ring.sx-is-offline path{stroke:#80848e}.sx-root .sx-ring.sx-ring-back path{stroke:var(--bg);stroke-width:calc(var(--sx-ring-w,3px) + 2 * var(--sx-ring-gap,3px))}.sx-root .sx-ring-presence{--sx-ring-gap:1.5px}.sx-root .sx-ring-presence path{stroke-width:calc(var(--sx-ring-w,3px) * 1.35)}.sx-root .sx-ring-soft{opacity:.6}.sx-root .sx-ring-soft path{stroke-width:calc(var(--sx-ring-w,3px) * .7)}</style><img class="badge-avatar sx-float" width="20" height="20" src="data:image/webp;base64," alt=""/><span class="badge-dot online" aria-label="Online"></span><span class="badge-text">Nothing here to care about</span></div></div></foreignObject></svg>