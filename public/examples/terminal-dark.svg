<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="420" height="270" viewBox="0 0 420 270" role="img" aria-label="LiênThuận&#x27;s Discord presence"><foreignObject x="0" y="0" width="420" height="270"><div xmlns="http://www.w3.org/1999/xhtml"><div class="dgp-terminal dark motion sx-root" style="width:420px;height:270px;--accent:#5865f2;--bg:#0b0c24;--radius:16px"><style>
.dgp-terminal{--ink:#f6f5ff;--muted:#bdc1e8;--panel:#1e2353;--line:#c7caff25;position:relative;isolation:isolate;box-sizing:border-box;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);font:13px/1.4 "Segoe UI",Arial,sans-serif}
.dgp-terminal.light{--ink:#20204a;--muted:#56577d;--panel:#e6e6ff;--line:#454b9a26}
.dgp-terminal *{box-sizing:border-box}.dgp-terminal img{display:block;object-fit:cover}.dgp-terminal .truncate{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.dgp-terminal .muted{color:var(--muted)}
.dgp-terminal .avatar-wrap{position:relative;flex:none;width:var(--avatar-size,64px);height:var(--avatar-size,64px);isolation:isolate}.dgp-terminal .avatar{width:100%;height:100%;border-radius:50%;background:var(--panel);border:3px solid var(--bg)}.dgp-terminal .decoration{position:absolute;inset:-10%;width:120%;height:120%;pointer-events:none}.dgp-terminal .status-dot{position:absolute;bottom:0;right:0;width:18px;height:18px;border:4px solid var(--bg);border-radius:50%}
.dgp-terminal .online{background:#23a55a}.dgp-terminal .idle{background:#f0b232}.dgp-terminal .dnd{background:#f23f43}.dgp-terminal .offline{background:#80848e}.dgp-terminal .status-dot.dnd:after{content:"";position:absolute;left:2px;top:4px;width:6px;height:2px;background:var(--bg)}
.dgp-terminal .name-line{display:flex;align-items:center;gap:6px;min-width:0}.dgp-terminal .display-name{font-size:24px;font-weight:900;line-height:1.2;letter-spacing:-.5px;margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.dgp-terminal .name-effect{background-size:200% 100%;animation:dgp-name 8s ease-in-out infinite alternate}.dgp-terminal .bot-chip{padding:1px 4px;border-radius:4px;background:var(--accent);color:white;font-size:9px;font-weight:800}
.dgp-terminal:not(.light) .display-name[style*="background-image"]{filter:brightness(1.4) saturate(.85)}
.dgp-terminal .guild-tag{display:inline-flex;gap:4px;align-items:center;flex:none;border:1px solid var(--line);border-radius:7px;padding:2px 5px;font-size:10px;font-weight:700}.dgp-terminal .guild-tag img{object-fit:contain}.dgp-terminal .badges{display:flex;gap:4px;overflow:hidden;align-items:center}.dgp-terminal .badges img{object-fit:contain;flex:none}.dgp-terminal .platforms{display:flex;gap:10px;height:24px;align-items:center;font-size:10px;color:var(--muted);overflow:hidden}.dgp-terminal .platforms>span{display:inline-flex;gap:4px;align-items:center;flex:none}
.dgp-terminal .content-sections{display:flex;flex-direction:column;gap:12px}.dgp-terminal .custom-status{height:44px;display:flex;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.dgp-terminal .custom-status img{object-fit:contain;flex:none}.dgp-terminal .kv{padding:12px 0;border-top:1px solid var(--line);overflow:hidden}.dgp-terminal .bio{margin:0 0 8px;height:40px;line-height:20px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.dgp-terminal .kv-line{height:24px;line-height:24px}.dgp-terminal .website{color:var(--muted)}
.dgp-terminal .activity-block{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px;overflow:hidden}.dgp-terminal .section-title{height:22px;line-height:16px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dgp-terminal .activity-row{height:82px;display:flex;gap:12px;align-items:flex-start}.dgp-terminal .activity-art{width:64px;height:64px;position:relative;flex:none}.dgp-terminal .activity-art>img{border-radius:10px}.dgp-terminal .activity-art .small-art{position:absolute;bottom:-4px;right:-4px;border:3px solid var(--panel);border-radius:50%}.dgp-terminal .art-placeholder{display:grid;place-items:center;width:64px;height:64px;border-radius:10px;background:var(--accent);color:#fff;font-size:28px}
.dgp-terminal .activity-copy{min-width:0;display:flex;flex-direction:column;gap:2px;font-size:11px;line-height:16px;flex:1}.dgp-terminal .activity-copy strong{font-size:13px;line-height:18px}.dgp-terminal .activity-timer{height:40px;color:var(--muted);font-size:10px;line-height:16px;font-variant-numeric:tabular-nums}.dgp-terminal .activity-buttons{height:32px;display:flex;gap:6px}.dgp-terminal .activity-buttons>span{min-width:0;flex:1;background:var(--line);border-radius:8px;padding:7px;text-align:center;font-size:10px;font-weight:600}.dgp-terminal .spotify-title{color:#74e9a6}.dgp-terminal.light .spotify-title{color:#176b40}.dgp-terminal .time-labels{display:flex;justify-content:space-between;margin-top:5px}.dgp-terminal .progress-track{height:4px;overflow:hidden;border-radius:4px;background:var(--line)}.dgp-terminal .progress-fill{height:4px;border-radius:4px;background:var(--accent)}.dgp-terminal .spotify-block .progress-fill{background:#23a55a}
.dgp-terminal .clock{display:inline-grid;line-height:16px;height:16px;vertical-align:bottom;font-variant-numeric:tabular-nums}.dgp-terminal .clock-running,.dgp-terminal .clock-final{grid-area:1/1;display:inline-flex}.dgp-terminal .clock-running{animation:dgp-hide 0s var(--run) forwards}.dgp-terminal .clock-final{visibility:hidden;animation:dgp-show 0s var(--run) forwards}.dgp-terminal .clock-window{height:16px;overflow:hidden;display:inline-block}.dgp-terminal .clock-reel{display:flex;flex-direction:column;animation-name:dgp-reel;animation-iteration-count:infinite}.dgp-terminal .clock-reel>span{display:block;height:16px;line-height:16px;flex:none;text-align:right}
.dgp-terminal .idle-state{height:50px;display:flex;gap:10px;align-items:center;padding:12px;background:var(--panel);border-radius:14px;color:var(--muted);font-size:11px}.dgp-terminal .idle-spark{color:#ec48bd;font-size:22px}.dgp-terminal .summary{display:flex;align-items:center;gap:6px;min-width:0;color:var(--muted);font-size:12px}.dgp-terminal .summary img{flex:none;border-radius:5px;object-fit:contain}.dgp-terminal .theme-footer{height:42px;display:flex;align-items:center;gap:6px;font-size:8px;letter-spacing:1px;color:var(--muted)}.dgp-terminal .theme-footer>span:first-child{font-size:14px;color:var(--accent)}.dgp-terminal .footer-credit{margin-left:auto;letter-spacing:0;font-size:9px}.dgp-terminal .theme-error{height:200px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.dgp-terminal .theme-error>span{color:#ec48bd;font-size:26px}.dgp-terminal .theme-error h1{margin:6px 0;font-size:20px;font-weight:900;overflow-wrap:anywhere}.dgp-terminal .theme-error p{margin:0;color:var(--muted);font-size:12px;line-height:18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.dgp-terminal .backdrop-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;pointer-events:none}
@keyframes dgp-progress{from{width:0%}to{width:100%}}@keyframes dgp-reel{to{transform:translateY(calc(var(--rows) * -16px))}}@keyframes dgp-hide{to{visibility:hidden}}@keyframes dgp-show{to{visibility:visible}}@keyframes dgp-name{to{background-position:100% 0}}

.dgp-terminal{--ink:#dfe2ff;--muted:#8d93c7;--panel:#151838;--line:#a3a8ff26;--key:#00b0f4;--prompt:#35ed7e;--magenta:#ec48bd;font:12px/18px ui-monospace,"Cascadia Mono",Consolas,Menlo,"Courier New",monospace;box-shadow:inset 0 0 0 1px #ffffff08}
.dgp-terminal.light{--ink:#24264d;--muted:#6a6e98;--panel:#ececfa;--line:#2b2f7a22;--key:#006ce7;--prompt:#118a3e;--magenta:#c42a96}
.dgp-terminal .term-title{height:32px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);color:var(--muted);font-size:11px}
.dgp-terminal .term-title>.truncate{flex:1;text-align:center}.dgp-terminal .term-size{flex:none;width:44px;text-align:right;font-size:10px;letter-spacing:.5px}
.dgp-terminal .term-lights{flex:none;width:44px;display:flex;gap:6px}.dgp-terminal .term-lights i{width:10px;height:10px;border-radius:50%;background:#f23f43}.dgp-terminal .term-lights i:nth-child(2){background:#f0b232}.dgp-terminal .term-lights i:nth-child(3){background:#23a55a}
.dgp-terminal .term-body{padding:12px 16px 14px}
.dgp-terminal .term-line{height:18px;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden}
.dgp-terminal .term-prompt{color:var(--prompt);font-weight:700}.dgp-terminal .term-arg{color:var(--key)}.dgp-terminal .term-dim{color:var(--muted)}
.dgp-terminal .term-fetch{display:flex;gap:14px;margin:6px 0 8px;align-items:flex-start}
.dgp-terminal .term-avatar{flex:none;width:72px;height:72px;border-radius:10px;background:var(--panel);box-shadow:0 0 0 1px var(--line),4px 4px 0 color-mix(in srgb,var(--accent) 55%,transparent)}
.dgp-terminal .term-info{min-width:0;flex:1}
.dgp-terminal .term-name{color:color-mix(in srgb,var(--accent) 55%,#fff);font-weight:700;flex:0 1 auto}.dgp-terminal.light .term-name{color:var(--accent)}
.dgp-terminal .term-rule{color:var(--line);display:block;color:color-mix(in srgb,var(--accent) 45%,transparent)}
.dgp-terminal .term-key{flex:none;width:8ch;color:var(--key)}.dgp-terminal .term-value{display:block;flex:1}.dgp-terminal .term-value img,.dgp-terminal .term-value i{vertical-align:-2px}
.dgp-terminal .term-dot{display:inline-block;flex:none;width:8px;height:8px;border-radius:50%;margin-right:7px}.dgp-terminal .term-dot.online{background:#23a55a}.dgp-terminal .term-dot.idle{background:#f0b232}.dgp-terminal .term-dot.dnd{background:#f23f43}.dgp-terminal .term-dot.offline{background:#80848e}
.dgp-terminal .term-emoji{display:inline-block;flex:none;object-fit:contain;margin-right:6px}.dgp-terminal .term-badges{display:inline-flex;gap:4px;vertical-align:-2px}.dgp-terminal .term-badges img{object-fit:contain}
.dgp-terminal .term-swatches{gap:0}.dgp-terminal .term-swatches i{width:14px;height:12px;background:#5865f2}.dgp-terminal .term-swatches i:nth-child(2){background:#7c4ddb}.dgp-terminal .term-swatches i:nth-child(3){background:#ec48bd}.dgp-terminal .term-swatches i:nth-child(4){background:#f23f43}.dgp-terminal .term-swatches i:nth-child(5){background:#f0b232}.dgp-terminal .term-swatches i:nth-child(6){background:#35ed7e}.dgp-terminal .term-swatches i:nth-child(7){background:#00b0f4}.dgp-terminal .term-swatches i:nth-child(8){background:var(--ink)}
.dgp-terminal .term-kind{flex:none;color:var(--magenta);font-weight:700}.dgp-terminal .term-item.spotify .term-kind{color:#1ed760}.dgp-terminal.light .term-item.spotify .term-kind{color:#118a3e}.dgp-terminal .term-item strong{font-weight:700}
.dgp-terminal .term-branch{padding-left:2ch}.dgp-terminal .term-tree{flex:none;color:var(--muted)}
.dgp-terminal .term-timer{color:var(--muted);font-variant-numeric:tabular-nums;min-width:0;flex:1}.dgp-terminal .term-timer.progress .timer-progress{display:flex;align-items:center;gap:10px}.dgp-terminal .term-timer .progress-track{width:120px;flex:none;height:8px;border-radius:0;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 8px)}
.dgp-terminal .term-timer .progress-fill{height:8px;border-radius:0;background:repeating-linear-gradient(90deg,var(--prompt) 0 6px,transparent 6px 8px)}.dgp-terminal .term-timer .time-labels{margin:0;gap:4px;justify-content:flex-start}.dgp-terminal .term-timer .time-labels>span:last-child:before{content:"/ "}

.dgp-terminal .term-error{color:#f23f43;font-weight:700}.dgp-terminal .term-message{height:54px;white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding-left:2ch;color:var(--ink)}
.dgp-terminal .term-cursor{display:inline-block;width:8px;height:15px;background:var(--prompt)}.dgp-terminal.motion .term-cursor{animation:dgp-terminal-blink 1.1s steps(1,end) infinite}
@keyframes dgp-terminal-blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.dgp-terminal .term-cursor{animation:none!important}}

.pf-banner{position:absolute;inset:0;overflow:hidden;pointer-events:none;background-size:cover}.pf-banner>img,.pf-banner>video{display:block;width:100%;height:100%;object-fit:cover}
.pf-effect{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:4;border-radius:inherit;}.pf-effect img{position:absolute;display:block;max-width:none;object-fit:fill}.pf-effect .pf-fx-still{left:0;top:0;width:100%;height:auto;min-width:100%}.pf-effect .pf-player{position:absolute;inset:0}.pf-effect .pf-playing>.pf-fx-still{display:none}
.pf-effect.pf-underlay{z-index:-1}
.sx-root{isolation:isolate}
.sx-root .sx-ring{position:absolute;z-index:-1;--sx-ro:calc(var(--sx-ring-gap,3px) + var(--sx-ring-w,3px) / 2);left:calc(-1 * var(--sx-ro));top:calc(-1 * var(--sx-ro));width:calc(100% + 2 * var(--sx-ro));height:calc(100% + 2 * var(--sx-ro));overflow:visible;pointer-events:none;display:block}.sx-root .sx-ring path{fill:none;stroke:var(--accent);stroke-width:var(--sx-ring-w,3px);stroke-linejoin:round;stroke-linecap:round}.sx-root .sx-ring.sx-is-online path{stroke:#23a55a}.sx-root .sx-ring.sx-is-idle path{stroke:#f0b232}.sx-root .sx-ring.sx-is-dnd path{stroke:#f23f43}.sx-root .sx-ring.sx-is-offline path{stroke:#80848e}.sx-root .sx-ring.sx-ring-back path{stroke:var(--bg);stroke-width:calc(var(--sx-ring-w,3px) + 2 * var(--sx-ring-gap,3px))}.sx-root .sx-ring-presence{--sx-ring-gap:1.5px}.sx-root .sx-ring-presence path{stroke-width:calc(var(--sx-ring-w,3px) * 1.35)}.sx-root .sx-ring-soft{opacity:.6}.sx-root .sx-ring-soft path{stroke-width:calc(var(--sx-ring-w,3px) * .7)}</style><header class="term-title"><span class="term-lights"><i></i><i></i><i></i></span><span class="truncate">lianharman@discord: ~/presence</span><span class="term-size">zsh</span></header><div class="term-body"><div class="term-line"><span class="term-prompt">❯</span> discord status --user <span class="term-arg">lianharman</span></div><div class="term-fetch" style="height:126px"><img class="term-avatar sx-float" width="72" height="72" src="data:image/webp;base64," alt=""/><div class="term-info"><div class="term-line"><strong class="term-name truncate">LiênThuận</strong><span class="term-dim truncate">@lianharman</span></div><div class="term-line term-rule" aria-hidden="true">────────────────────────────────────────────────────────────</div><div class="term-line"><span class="term-key">status</span><span class="term-value truncate"><i class="term-dot online"></i>online</span></div><div class="term-line"><span class="term-key">custom</span><span class="term-value truncate">&quot;Nothing here to care about&quot;</span></div><div class="term-line"><span class="term-key">tag</span><span class="term-value truncate">ᗪᗴᐯ</span></div><div class="term-line"><span class="term-key">client</span><span class="term-value truncate">web</span></div><div class="term-line term-swatches" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div><div class="term-line"><span class="term-prompt">❯</span> discord activity --now</div><div class="term-line term-dim truncate">(idle) Enjoying a quiet moment</div><div class="term-line"><span class="term-prompt">❯</span> <span class="term-cursor"></span></div></div></div></div></foreignObject></svg>