<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280" role="img" aria-label="LiênThuận&#x27;s Discord presence"><foreignObject x="0" y="0" width="420" height="280"><div xmlns="http://www.w3.org/1999/xhtml"><div class="dgp-activity dark idle sx-root" style="width:420px;height:280px;--accent:#5865f2;--bg:#0a0d3a;--radius:16px"><style>
.dgp-activity{--ink:#f6f5ff;--muted:#bdc1e8;--panel:#1e2353;--line:#c7caff25;position:relative;isolation:isolate;box-sizing:border-box;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);font:13px/1.4 "Segoe UI",Arial,sans-serif}
.dgp-activity.light{--ink:#20204a;--muted:#56577d;--panel:#e6e6ff;--line:#454b9a26}
.dgp-activity *{box-sizing:border-box}.dgp-activity img{display:block;object-fit:cover}.dgp-activity .truncate{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.dgp-activity .muted{color:var(--muted)}
.dgp-activity .avatar-wrap{position:relative;flex:none;width:var(--avatar-size,64px);height:var(--avatar-size,64px);isolation:isolate}.dgp-activity .avatar{width:100%;height:100%;border-radius:50%;background:var(--panel);border:3px solid var(--bg)}.dgp-activity .decoration{position:absolute;inset:-10%;width:120%;height:120%;pointer-events:none}.dgp-activity .status-dot{position:absolute;bottom:0;right:0;width:18px;height:18px;border:4px solid var(--bg);border-radius:50%}
.dgp-activity .online{background:#23a55a}.dgp-activity .idle{background:#f0b232}.dgp-activity .dnd{background:#f23f43}.dgp-activity .offline{background:#80848e}.dgp-activity .status-dot.dnd:after{content:"";position:absolute;left:2px;top:4px;width:6px;height:2px;background:var(--bg)}
.dgp-activity .name-line{display:flex;align-items:center;gap:6px;min-width:0}.dgp-activity .display-name{font-size:24px;font-weight:900;line-height:1.2;letter-spacing:-.5px;margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.dgp-activity .name-effect{background-size:200% 100%;animation:dgp-name 8s ease-in-out infinite alternate}.dgp-activity .bot-chip{padding:1px 4px;border-radius:4px;background:var(--accent);color:white;font-size:9px;font-weight:800}
.dgp-activity:not(.light) .display-name[style*="background-image"]{filter:brightness(1.4) saturate(.85)}
.dgp-activity .guild-tag{display:inline-flex;gap:4px;align-items:center;flex:none;border:1px solid var(--line);border-radius:7px;padding:2px 5px;font-size:10px;font-weight:700}.dgp-activity .guild-tag img{object-fit:contain}.dgp-activity .badges{display:flex;gap:4px;overflow:hidden;align-items:center}.dgp-activity .badges img{object-fit:contain;flex:none}.dgp-activity .platforms{display:flex;gap:10px;height:24px;align-items:center;font-size:10px;color:var(--muted);overflow:hidden}.dgp-activity .platforms>span{display:inline-flex;gap:4px;align-items:center;flex:none}
.dgp-activity .content-sections{display:flex;flex-direction:column;gap:12px}.dgp-activity .custom-status{height:44px;display:flex;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.dgp-activity .custom-status img{object-fit:contain;flex:none}.dgp-activity .kv{padding:12px 0;border-top:1px solid var(--line);overflow:hidden}.dgp-activity .bio{margin:0 0 8px;height:40px;line-height:20px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.dgp-activity .kv-line{height:24px;line-height:24px}.dgp-activity .website{color:var(--muted)}
.dgp-activity .activity-block{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px;overflow:hidden}.dgp-activity .section-title{height:22px;line-height:16px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dgp-activity .activity-row{height:82px;display:flex;gap:12px;align-items:flex-start}.dgp-activity .activity-art{width:64px;height:64px;position:relative;flex:none}.dgp-activity .activity-art>img{border-radius:10px}.dgp-activity .activity-art .small-art{position:absolute;bottom:-4px;right:-4px;border:3px solid var(--panel);border-radius:50%}.dgp-activity .art-placeholder{display:grid;place-items:center;width:64px;height:64px;border-radius:10px;background:var(--accent);color:#fff;font-size:28px}
.dgp-activity .activity-copy{min-width:0;display:flex;flex-direction:column;gap:2px;font-size:11px;line-height:16px;flex:1}.dgp-activity .activity-copy strong{font-size:13px;line-height:18px}.dgp-activity .activity-timer{height:40px;color:var(--muted);font-size:10px;line-height:16px;font-variant-numeric:tabular-nums}.dgp-activity .activity-buttons{height:32px;display:flex;gap:6px}.dgp-activity .activity-buttons>span{min-width:0;flex:1;background:var(--line);border-radius:8px;padding:7px;text-align:center;font-size:10px;font-weight:600}.dgp-activity .spotify-title{color:#74e9a6}.dgp-activity.light .spotify-title{color:#176b40}.dgp-activity .time-labels{display:flex;justify-content:space-between;margin-top:5px}.dgp-activity .progress-track{height:4px;overflow:hidden;border-radius:4px;background:var(--line)}.dgp-activity .progress-fill{height:4px;border-radius:4px;background:var(--accent)}.dgp-activity .spotify-block .progress-fill{background:#23a55a}
.dgp-activity .clock{display:inline-grid;line-height:16px;height:16px;vertical-align:bottom;font-variant-numeric:tabular-nums}.dgp-activity .clock-running,.dgp-activity .clock-final{grid-area:1/1;display:inline-flex}.dgp-activity .clock-running{animation:dgp-hide 0s var(--run) forwards}.dgp-activity .clock-final{visibility:hidden;animation:dgp-show 0s var(--run) forwards}.dgp-activity .clock-window{height:16px;overflow:hidden;display:inline-block}.dgp-activity .clock-reel{display:flex;flex-direction:column;animation-name:dgp-reel;animation-iteration-count:infinite}.dgp-activity .clock-reel>span{display:block;height:16px;line-height:16px;flex:none;text-align:right}
.dgp-activity .idle-state{height:50px;display:flex;gap:10px;align-items:center;padding:12px;background:var(--panel);border-radius:14px;color:var(--muted);font-size:11px}.dgp-activity .idle-spark{color:#ec48bd;font-size:22px}.dgp-activity .summary{display:flex;align-items:center;gap:6px;min-width:0;color:var(--muted);font-size:12px}.dgp-activity .summary img{flex:none;border-radius:5px;object-fit:contain}.dgp-activity .theme-footer{height:42px;display:flex;align-items:center;gap:6px;font-size:8px;letter-spacing:1px;color:var(--muted)}.dgp-activity .theme-footer>span:first-child{font-size:14px;color:var(--accent)}.dgp-activity .footer-credit{margin-left:auto;letter-spacing:0;font-size:9px}.dgp-activity .theme-error{height:200px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.dgp-activity .theme-error>span{color:#ec48bd;font-size:26px}.dgp-activity .theme-error h1{margin:6px 0;font-size:20px;font-weight:900;overflow-wrap:anywhere}.dgp-activity .theme-error p{margin:0;color:var(--muted);font-size:12px;line-height:18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.dgp-activity .backdrop-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;pointer-events:none}
@keyframes dgp-progress{from{width:0%}to{width:100%}}@keyframes dgp-reel{to{transform:translateY(calc(var(--rows) * -16px))}}@keyframes dgp-hide{to{visibility:hidden}}@keyframes dgp-show{to{visibility:visible}}@keyframes dgp-name{to{background-position:100% 0}}

.dgp-activity .stage-fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;max-width:90%;color:white;text-transform:uppercase;font-size:11px;letter-spacing:2px}.dgp-activity .stage-fallback>span{display:grid;place-items:center;width:70px;height:70px;border-radius:22px;border:1px solid #ffffff60;background:#ffffff15;font-size:40px;line-height:1}.dgp-activity .stage-fallback>strong{max-width:100%}
.dgp-activity{background-image:radial-gradient(ellipse at 100% 20%,#5865f230,transparent 70%)}.dgp-activity .activity-identity{height:83px;padding:18px 22px;display:flex;align-items:center;gap:12px;--avatar-size:42px}.dgp-activity .activity-identity>.badges{flex:none;max-width:60px}.dgp-activity .activity-identity>.badges img{width:16px;height:16px}.dgp-activity .activity-identity-copy{min-width:0;flex:1}.dgp-activity .display-name{font-size:17px;line-height:22px}.dgp-activity .activity-identity-copy>span{display:block;font-size:10px}.dgp-activity .activity-identity-mark{font-size:24px;color:#ec48bd}.dgp-activity .status-dot{width:14px;height:14px;border-width:3px}.dgp-activity .avatar-wrap{--sx-ring-w:2px;--sx-ring-gap:2px}.dgp-activity .activity-stage{height:192px;position:relative;display:flex;align-items:center;justify-content:center;margin:0 20px;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#5865f2,#6e38ae,#ec48bd);isolation:isolate}.dgp-activity .stage-backdrop{position:absolute;inset:-20%;width:140%;height:140%;filter:blur(24px) brightness(.4) saturate(1.4);opacity:.8;z-index:-1}.dgp-activity .stage-art{width:140px;height:140px;object-fit:contain;border-radius:14px;box-shadow:0 12px 24px #0a0d3a66}.dgp-activity .stage-chip{position:absolute;bottom:10px;right:12px;background:#0a0d3acc;border:1px solid #ffffff30;border-radius:20px;color:#fff;font-size:8px;font-weight:800;letter-spacing:1px;padding:4px 8px}.dgp-activity .activity-feature-copy{height:112px;padding:14px 24px 8px;font-size:12px;line-height:19px;overflow:hidden}.dgp-activity .activity-kicker{font-size:9px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);line-height:18px}.dgp-activity .activity-feature-copy h2{font-size:22px;font-weight:900;letter-spacing:-.6px;line-height:30px;margin:0 0 2px}.dgp-activity .presence-timer{height:44px;padding:2px 24px 0;font-size:10px;color:var(--muted);line-height:16px}.dgp-activity.spotify .progress-fill{background:#23a55a}.dgp-activity .activity-bottom{padding:0 24px}.dgp-activity .activity-idle{height:154px;padding:8px 24px 20px;text-align:center;overflow:hidden}.dgp-activity .idle-moon{display:block;color:#c9a9ff;font-size:52px;line-height:60px}.dgp-activity .activity-idle strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:17px;line-height:24px;margin-top:4px;overflow-wrap:anywhere}.dgp-activity .theme-error{height:240px}

.pf-banner{position:absolute;inset:0;overflow:hidden;pointer-events:none;background-size:cover}.pf-banner>img,.pf-banner>video{display:block;width:100%;height:100%;object-fit:cover}
.pf-effect{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:4;border-radius:inherit;}.pf-effect img{position:absolute;display:block;max-width:none;object-fit:fill}.pf-effect .pf-fx-still{left:0;top:0;width:100%;height:auto;min-width:100%}.pf-effect .pf-player{position:absolute;inset:0}.pf-effect .pf-playing>.pf-fx-still{display:none}
.pf-effect.pf-underlay{z-index:-1}
.sx-root{isolation:isolate}
.sx-root .sx-ring{position:absolute;z-index:-1;--sx-ro:calc(var(--sx-ring-gap,3px) + var(--sx-ring-w,3px) / 2);left:calc(-1 * var(--sx-ro));top:calc(-1 * var(--sx-ro));width:calc(100% + 2 * var(--sx-ro));height:calc(100% + 2 * var(--sx-ro));overflow:visible;pointer-events:none;display:block}.sx-root .sx-ring path{fill:none;stroke:var(--accent);stroke-width:var(--sx-ring-w,3px);stroke-linejoin:round;stroke-linecap:round}.sx-root .sx-ring.sx-is-online path{stroke:#23a55a}.sx-root .sx-ring.sx-is-idle path{stroke:#f0b232}.sx-root .sx-ring.sx-is-dnd path{stroke:#f23f43}.sx-root .sx-ring.sx-is-offline path{stroke:#80848e}.sx-root .sx-ring.sx-ring-back path{stroke:var(--bg);stroke-width:calc(var(--sx-ring-w,3px) + 2 * var(--sx-ring-gap,3px))}.sx-root .sx-ring-presence{--sx-ring-gap:1.5px}.sx-root .sx-ring-presence path{stroke-width:calc(var(--sx-ring-w,3px) * 1.35)}.sx-root .sx-ring-soft{opacity:.6}.sx-root .sx-ring-soft path{stroke-width:calc(var(--sx-ring-w,3px) * .7)}</style><header class="activity-identity"><div class="avatar-wrap sx-shape-circle"><svg xmlns="http://www.w3.org/2000/svg" class="sx-ring sx-ring-back" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M50 0A50 50 0 1 1 50 100A50 50 0 1 1 50 0Z" vector-effect="non-scaling-stroke"></path></svg><svg xmlns="http://www.w3.org/2000/svg" class="sx-ring sx-ring-status sx-is-online" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M50 0A50 50 0 1 1 50 100A50 50 0 1 1 50 0Z" vector-effect="non-scaling-stroke"></path></svg><img class="avatar" width="80" height="80" src="data:image/webp;base64," alt=""/><span class="status-dot online" title="online" aria-label="online"></span></div><div class="activity-identity-copy"><div class="name-line"><h1 class="display-name" title="LiênThuận">LiênThuận</h1></div><span class="muted truncate">@lianharman</span></div></header><div class="activity-idle"><span class="idle-moon">☾</span><div class="activity-kicker">TAKING A BREATHER</div><strong>Nothing here to care about</strong></div><div class="activity-bottom"><footer class="theme-footer"><span>◈</span>DISCORD PRESENCE<span class="footer-credit">Powered by Lanyard</span></footer></div></div></div></foreignObject></svg>