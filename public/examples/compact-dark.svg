<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="420" height="68" viewBox="0 0 420 68" role="img" aria-label="LiênThuận&#x27;s Discord presence"><foreignObject x="0" y="0" width="420" height="68"><div xmlns="http://www.w3.org/1999/xhtml"><div class="dgp-compact dark sx-root" style="width:420px;height:68px;--accent:#5865f2;--bg:#0a0d3a;--radius:16px"><style>
.dgp-compact{--ink:#f6f5ff;--muted:#bdc1e8;--panel:#1e2353;--line:#c7caff25;position:relative;isolation:isolate;box-sizing:border-box;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);font:13px/1.4 "Segoe UI",Arial,sans-serif}
.dgp-compact.light{--ink:#20204a;--muted:#56577d;--panel:#e6e6ff;--line:#454b9a26}
.dgp-compact *{box-sizing:border-box}.dgp-compact img{display:block;object-fit:cover}.dgp-compact .truncate{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.dgp-compact .muted{color:var(--muted)}
.dgp-compact .avatar-wrap{position:relative;flex:none;width:var(--avatar-size,64px);height:var(--avatar-size,64px);isolation:isolate}.dgp-compact .avatar{width:100%;height:100%;border-radius:50%;background:var(--panel);border:3px solid var(--bg)}.dgp-compact .decoration{position:absolute;inset:-10%;width:120%;height:120%;pointer-events:none}.dgp-compact .status-dot{position:absolute;bottom:0;right:0;width:18px;height:18px;border:4px solid var(--bg);border-radius:50%}
.dgp-compact .online{background:#23a55a}.dgp-compact .idle{background:#f0b232}.dgp-compact .dnd{background:#f23f43}.dgp-compact .offline{background:#80848e}.dgp-compact .status-dot.dnd:after{content:"";position:absolute;left:2px;top:4px;width:6px;height:2px;background:var(--bg)}
.dgp-compact .name-line{display:flex;align-items:center;gap:6px;min-width:0}.dgp-compact .display-name{font-size:24px;font-weight:900;line-height:1.2;letter-spacing:-.5px;margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.dgp-compact .name-effect{background-size:200% 100%;animation:dgp-name 8s ease-in-out infinite alternate}.dgp-compact .bot-chip{padding:1px 4px;border-radius:4px;background:var(--accent);color:white;font-size:9px;font-weight:800}
.dgp-compact:not(.light) .display-name[style*="background-image"]{filter:brightness(1.4) saturate(.85)}
.dgp-compact .guild-tag{display:inline-flex;gap:4px;align-items:center;flex:none;border:1px solid var(--line);border-radius:7px;padding:2px 5px;font-size:10px;font-weight:700}.dgp-compact .guild-tag img{object-fit:contain}.dgp-compact .badges{display:flex;gap:4px;overflow:hidden;align-items:center}.dgp-compact .badges img{object-fit:contain;flex:none}.dgp-compact .platforms{display:flex;gap:10px;height:24px;align-items:center;font-size:10px;color:var(--muted);overflow:hidden}.dgp-compact .platforms>span{display:inline-flex;gap:4px;align-items:center;flex:none}
.dgp-compact .content-sections{display:flex;flex-direction:column;gap:12px}.dgp-compact .custom-status{height:44px;display:flex;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.dgp-compact .custom-status img{object-fit:contain;flex:none}.dgp-compact .kv{padding:12px 0;border-top:1px solid var(--line);overflow:hidden}.dgp-compact .bio{margin:0 0 8px;height:40px;line-height:20px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.dgp-compact .kv-line{height:24px;line-height:24px}.dgp-compact .website{color:var(--muted)}
.dgp-compact .activity-block{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px;overflow:hidden}.dgp-compact .section-title{height:22px;line-height:16px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dgp-compact .activity-row{height:82px;display:flex;gap:12px;align-items:flex-start}.dgp-compact .activity-art{width:64px;height:64px;position:relative;flex:none}.dgp-compact .activity-art>img{border-radius:10px}.dgp-compact .activity-art .small-art{position:absolute;bottom:-4px;right:-4px;border:3px solid var(--panel);border-radius:50%}.dgp-compact .art-placeholder{display:grid;place-items:center;width:64px;height:64px;border-radius:10px;background:var(--accent);color:#fff;font-size:28px}
.dgp-compact .activity-copy{min-width:0;display:flex;flex-direction:column;gap:2px;font-size:11px;line-height:16px;flex:1}.dgp-compact .activity-copy strong{font-size:13px;line-height:18px}.dgp-compact .activity-timer{height:40px;color:var(--muted);font-size:10px;line-height:16px;font-variant-numeric:tabular-nums}.dgp-compact .activity-buttons{height:32px;display:flex;gap:6px}.dgp-compact .activity-buttons>span{min-width:0;flex:1;background:var(--line);border-radius:8px;padding:7px;text-align:center;font-size:10px;font-weight:600}.dgp-compact .spotify-title{color:#74e9a6}.dgp-compact.light .spotify-title{color:#176b40}.dgp-compact .time-labels{display:flex;justify-content:space-between;margin-top:5px}.dgp-compact .progress-track{height:4px;overflow:hidden;border-radius:4px;background:var(--line)}.dgp-compact .progress-fill{height:4px;border-radius:4px;background:var(--accent)}.dgp-compact .spotify-block .progress-fill{background:#23a55a}
.dgp-compact .clock{display:inline-grid;line-height:16px;height:16px;vertical-align:bottom;font-variant-numeric:tabular-nums}.dgp-compact .clock-running,.dgp-compact .clock-final{grid-area:1/1;display:inline-flex}.dgp-compact .clock-running{animation:dgp-hide 0s var(--run) forwards}.dgp-compact .clock-final{visibility:hidden;animation:dgp-show 0s var(--run) forwards}.dgp-compact .clock-window{height:16px;overflow:hidden;display:inline-block}.dgp-compact .clock-reel{display:flex;flex-direction:column;animation-name:dgp-reel;animation-iteration-count:infinite}.dgp-compact .clock-reel>span{display:block;height:16px;line-height:16px;flex:none;text-align:right}
.dgp-compact .idle-state{height:50px;display:flex;gap:10px;align-items:center;padding:12px;background:var(--panel);border-radius:14px;color:var(--muted);font-size:11px}.dgp-compact .idle-spark{color:#ec48bd;font-size:22px}.dgp-compact .summary{display:flex;align-items:center;gap:6px;min-width:0;color:var(--muted);font-size:12px}.dgp-compact .summary img{flex:none;border-radius:5px;object-fit:contain}.dgp-compact .theme-footer{height:42px;display:flex;align-items:center;gap:6px;font-size:8px;letter-spacing:1px;color:var(--muted)}.dgp-compact .theme-footer>span:first-child{font-size:14px;color:var(--accent)}.dgp-compact .footer-credit{margin-left:auto;letter-spacing:0;font-size:9px}.dgp-compact .theme-error{height:200px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.dgp-compact .theme-error>span{color:#ec48bd;font-size:26px}.dgp-compact .theme-error h1{margin:6px 0;font-size:20px;font-weight:900;overflow-wrap:anywhere}.dgp-compact .theme-error p{margin:0;color:var(--muted);font-size:12px;line-height:18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.dgp-compact .backdrop-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;pointer-events:none}
@keyframes dgp-progress{from{width:0%}to{width:100%}}@keyframes dgp-reel{to{transform:translateY(calc(var(--rows) * -16px))}}@keyframes dgp-hide{to{visibility:hidden}}@keyframes dgp-show{to{visibility:visible}}@keyframes dgp-name{to{background-position:100% 0}}

.dgp-compact .compact-copy>strong{display:block;font-size:17px}
.dgp-compact{--avatar-size:42px;display:flex;align-items:center;gap:12px;padding:12px 18px;background-image:radial-gradient(ellipse at 100% 0%,#5865f22b,transparent 70%)}.dgp-compact .compact-rail{position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:4px;background:linear-gradient(var(--accent),#ec48bd)}.dgp-compact .compact-copy{min-width:0;flex:1}.dgp-compact .display-name{font-size:17px;line-height:22px;letter-spacing:-.3px}.dgp-compact .summary{height:19px;margin-top:2px;font-size:11px}.dgp-compact .summary img{width:16px;height:16px}.dgp-compact .status-dot{width:14px;height:14px;border-width:3px}.dgp-compact .status-dot.dnd:after{width:4px;left:2px;top:3px}.dgp-compact .avatar-wrap{--sx-ring-w:2px;--sx-ring-gap:2px}
.dgp-compact .compact-meta{display:flex;align-items:center;gap:8px}.dgp-compact .compact-meta .summary{flex:1;margin-top:0}.dgp-compact .compact-meta .badges{flex:none;height:18px}.dgp-compact .compact-meta .badges img{width:16px;height:16px}.dgp-compact .badges{max-width:64px}.dgp-compact .name-line{min-width:0;flex:1}

.pf-banner{position:absolute;inset:0;overflow:hidden;pointer-events:none;background-size:cover}.pf-banner>img,.pf-banner>video{display:block;width:100%;height:100%;object-fit:cover}
.pf-effect{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:4;border-radius:inherit;}.pf-effect img{position:absolute;display:block;max-width:none;object-fit:fill}.pf-effect .pf-fx-still{left:0;top:0;width:100%;height:auto;min-width:100%}.pf-effect .pf-player{position:absolute;inset:0}.pf-effect .pf-playing>.pf-fx-still{display:none}
.pf-effect.pf-underlay{z-index:-1}
.sx-root{isolation:isolate}
.sx-root .status-glyph{display:block;width:100%;height:100%}.sx-root .status-dot{background:var(--bg)!important}.sx-root .status-dot:after{content:none!important}.sx-root .sd-host{background:none!important;box-shadow:none!important}
.sx-root .sx-ring{position:absolute;z-index:-1;--sx-ro:calc(var(--sx-ring-gap,3px) + var(--sx-ring-w,3px) / 2);left:calc(-1 * var(--sx-ro));top:calc(-1 * var(--sx-ro));width:calc(100% + 2 * var(--sx-ro));height:calc(100% + 2 * var(--sx-ro));overflow:visible;pointer-events:none;display:block}.sx-root .sx-ring path{fill:none;stroke:var(--accent);stroke-width:var(--sx-ring-w,3px);stroke-linejoin:round;stroke-linecap:round}.sx-root .sx-ring.sx-is-online path{stroke:#23a55a}.sx-root .sx-ring.sx-is-idle path{stroke:#f0b232}.sx-root .sx-ring.sx-is-dnd path{stroke:#f23f43}.sx-root .sx-ring.sx-is-offline path{stroke:#80848e}.sx-root .sx-ring.sx-ring-back path{stroke:var(--bg);stroke-width:calc(var(--sx-ring-w,3px) + 2 * var(--sx-ring-gap,3px))}.sx-root .sx-ring-presence{--sx-ring-gap:1.5px}.sx-root .sx-ring-presence path{stroke-width:calc(var(--sx-ring-w,3px) * 1.35)}.sx-root .sx-ring-soft{opacity:.6}.sx-root .sx-ring-soft path{stroke-width:calc(var(--sx-ring-w,3px) * .7)}</style><span class="compact-rail"></span><div class="avatar-wrap sx-shape-circle"><svg xmlns="http://www.w3.org/2000/svg" class="sx-ring sx-ring-back" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M50 0A50 50 0 1 1 50 100A50 50 0 1 1 50 0Z" vector-effect="non-scaling-stroke"></path></svg><svg xmlns="http://www.w3.org/2000/svg" class="sx-ring sx-ring-status sx-is-online" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M50 0A50 50 0 1 1 50 100A50 50 0 1 1 50 0Z" vector-effect="non-scaling-stroke"></path></svg><img class="avatar" width="80" height="80" src="data:image/webp;base64," alt=""/><span class="status-dot online" title="Online" aria-label="Online"><svg xmlns="http://www.w3.org/2000/svg" class="status-glyph sd-online" viewBox="0 0 10 10" aria-hidden="true"><path fill="#23a55a" fill-rule="evenodd" d="M5 0a5 5 0 1 1 0 10A5 5 0 1 1 5 0Z"></path></svg></span></div><div class="compact-copy"><div class="name-line"><h1 class="display-name" title="LiênThuận">LiênThuận</h1></div><div class="compact-meta"><div class="summary"><span class="truncate">Nothing here to care about</span></div></div></div></div></div></foreignObject></svg>