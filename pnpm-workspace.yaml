# Keep the package store inside the checkout and avoid Windows hard-link locks.
# The virtual store stays in node_modules/.pnpm (the default): build caches such as Vercel's
# restore node_modules but not other folders, so links into an outside virtual store break.
storeDir: .pnpm-store
packageImportMethod: copy

# pnpm 11 fails CI installs when a dependency build script is not explicitly allowed.
allowBuilds:
  esbuild: true
  # Cloudflare Workers runtime used by OpenNext and wrangler (see docs/DEPLOY-CLOUDFLARE.md).
  workerd: true
